name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME: ecommerce
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Database for E2E
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME: ecommerce
        run: |
          # 1. Run Migrations
          npx typeorm-ts-node-commonjs migration:run -d src/config/data-source.ts
          # 1.1 Verify duplicate-order column exists (fail fast if migration did not apply)
          npx ts-node node_modules/typeorm/cli.js query "SELECT column_name FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'isPotentialDuplicate';" -d src/config/data-source.ts | grep -q "isPotentialDuplicate"

          # 1.2 Show migration status for easier CI debugging
          npx typeorm-ts-node-commonjs migration:show -d src/config/data-source.ts

          # 2. Fix Sequence (to avoid duplicate ID errors during tests)
          npx ts-node node_modules/typeorm/cli.js query "SELECT setval(pg_get_serial_sequence('orders', 'id'), coalesce(max(id),0) + 1, false) FROM orders;" -d src/config/data-source.ts
          # 3. Seed Variants
          npx ts-node seed-variants.ts

      - name: Start Server for E2E
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME: ecommerce
          PORT: 3000
        run: |
          npm run dev &
          npx wait-on http://localhost:3000

      - name: Run Playwright E2E tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME: ecommerce
          CI: true
        run: npx playwright test --config=playwright.config.ts
